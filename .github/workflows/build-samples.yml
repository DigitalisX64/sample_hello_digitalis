name: Build Samples

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install glslang
        run: |
          sudo apt-get update
          sudo apt-get install -y glslang-tools

      - name: Install missing SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      # Cap Gradle to 2 workers on the restricted CI runner ONLY (local builds
      # keep full parallelism via the committed gradle.properties). Without the
      # cap, Gradle fans out one worker per CPU and runs that many D8 / dex- and
      # resource-merge / native-compile tasks across the ~130 modules at once,
      # spiking peak memory past the runner and causing flaky R8/merge OOM (or an
      # OOM-killed daemon surfacing as random task failures). Two workers keeps
      # peak memory bounded and the build stable.
      - name: Build all APKs
        run: ./gradlew assembleDebug assembleAndroidTest --max-workers=2

  # hello-qt is a standalone Qt-for-Android project (see hello-qt/README.md):
  # Qt 6.7's androiddeployqt generates a Gradle 8.3 / AGP 7.4.1 project that is
  # incompatible with the suite's Gradle/AGP, so it is not part of the root
  # Gradle build and gets its own job with a pinned Qt toolchain provisioned
  # via aqtinstall (the same recipe hello-qt/build-apk.sh documents).
  build-qt:
    runs-on: ubuntu-latest
    env:
      QT_VERSION: 6.7.3
      NDK_VERSION: 26.1.10909125
    steps:
      - uses: actions/checkout@v4

      # AGP 7.4.1 / Gradle 8.3 (the versions Qt 6.7 generates) are validated
      # up to JDK 17; the suite job's JDK 21 stays separate.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Install SDK components
        # build-apk.sh pins android-34 + build-tools 34.0.0 (the newest the
        # generated AGP 7.4.1 toolchain's aapt2 can parse) and needs an NDK;
        # pin r26b, the release Qt 6.7 validates against, rather than trusting
        # whatever the runner image ships.
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"

      - name: Cache Qt
        id: cache-qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-${{ env.QT_VERSION }}-linux-gcc64-android-arm64

      - name: Install Qt (desktop host + android_arm64_v8a) via aqtinstall
        if: steps.cache-qt.outputs.cache-hit != 'true'
        run: |
          pipx install aqtinstall || python3 -m pip install --user aqtinstall
          PATH="$HOME/.local/bin:$PATH"
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64      --outputdir "$HOME/qt"
          aqt install-qt linux android "$QT_VERSION" android_arm64_v8a --outputdir "$HOME/qt"

      - name: Cache Gradle (Qt-generated project)
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-qt-${{ env.QT_VERSION }}
          restore-keys: gradle-qt-

      - name: Build hello-qt APK
        run: |
          export QT_ROOT="$HOME/qt/$QT_VERSION"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/$NDK_VERSION"
          ./hello-qt/build-apk.sh

      - name: Verify APK is arm64-only with the Qt native lib
        run: |
          unzip -l hello-qt/hello-qt-debug.apk | grep 'lib/arm64-v8a/libhello_qt_arm64-v8a.so'
          if unzip -l hello-qt/hello-qt-debug.apk | grep -qE 'lib/(armeabi|x86)'; then
            echo 'unexpected non-arm64 ABI in APK' >&2; exit 1
          fi

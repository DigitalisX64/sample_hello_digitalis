[versions]
agp = "9.0.0"
compose-bom = "2024.01.00"
appcompat = "1.6.1"
constraintlayout = "2.1.4"
core-ktx = "1.12.0"
lifecycle = "2.7.0"
activity-compose = "1.8.2"
material = "1.11.0"
test-runner = "1.5.2"
test-ext-junit = "1.1.5"
test-uiautomator = "2.3.0"
test-espresso = "3.5.1"
test-ext-junit-gtest = "1.0.0-alpha01"
googletest = "1.11.0-beta-1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "agp" }

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
compose-material3 = { module = "androidx.compose.material3:material3" }
material = { module = "com.google.android.material:material", version.ref = "material" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-ext-junit" }
test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "test-uiautomator" }
test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "test-espresso" }
test-ext-junit-gtest = { module = "androidx.test.ext:junit-gtest", version.ref = "test-ext-junit-gtest" }
ndk-googletest = { module = "com.android.ndk.thirdparty:googletest", version.ref = "googletest" }

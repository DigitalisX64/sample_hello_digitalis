// This empty settings file anchors the androiddeployqt-generated Gradle build
// to the android-build output directory. Without it, Gradle walks up the
// directory tree and is captured by the Digitalis sample suite's
// settings.gradle.kts (Gradle 9.1 / AGP 9.0), which conflicts with the
// Gradle 8.3 / AGP 7.4.1 that Qt 6.7's androiddeployqt template targets. Qt's
// androiddeployqt copies this file from the package source dir into the build
// directory, keeping the Qt APK build self-contained and isolated from the
// suite. See README.md.

rootProject.name = "hello-qt"
